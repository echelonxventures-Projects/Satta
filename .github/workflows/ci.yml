# CI mirrors `task ci` exactly — the Taskfile rule: anything CI runs must be
# runnable identically by a developer with one command. v1.2 (G14): SCA stage
# added (govulncheck). Breaking-change check owns the git-history baseline.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking and --new-from-rev need history
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.52.0

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --new-from-rev=HEAD~1
          skip-cache: false

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup-only: true

      - name: Install protoc plugins
        run: task tools:proto

      - name: Build
        run: task build

      - name: Lint (Go + proto + invariants)
        run: task lint

      - name: Proto breaking changes
        run: task breaking

      - name: Unit tests
        run: task test

      - name: SCA — vulnerability scan (v1.2 G14)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Integration tests (local substrate)
        run: task test:integration

  # The deploy-pipeline half (S4a): the same job a developer runs with
  # `task ci:infra` — build the reference image, lint and fully render the chart.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.52.0

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Image build + chart lint/render
        run: task ci:infra

  # The frontend half (S13/ADR-0005): contracts regenerate clean and every
  # workspace test runs — including packages/money replaying the SAME golden
  # corpus as the Go money package (Invariant 1 into the browser).
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches the local toolchain exactly; type stripping and `--test`
          # discovery differ across majors and CI must not diverge from
          # `task ci:apps`.
          node-version: '26'
          cache: npm

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.52.0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup-only: true

      - name: Contract regeneration is drift-free; workspace tests pass
        run: task ci:apps
