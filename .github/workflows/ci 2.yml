# CI mirrors `task ci` exactly — the Taskfile rule: anything CI runs must be
# runnable identically by a developer with one command. v1.2 (G14): SCA stage
# added (govulncheck). Breaking-change check owns the git-history baseline.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking and --new-from-rev need history
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install task
        uses: arduino/setup-task@v2
        with:
          version: 3.52.0

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --new-from-rev=HEAD~1
          skip-cache: false

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup-only: true

      - name: Install protoc plugins
        run: task tools:proto

      - name: Build
        run: task build

      - name: Lint (Go + proto + invariants)
        run: task lint

      - name: Proto breaking changes
        run: task breaking

      - name: Unit tests
        run: task test

      - name: SCA — vulnerability scan (v1.2 G14)
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Integration tests (local substrate)
        run: task test:integration
