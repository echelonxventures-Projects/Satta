version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/satta/platform/libs/go/gen
plugins:
  - local: protoc-gen-go
    out: ../libs/go/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../libs/go/gen
    opt: paths=source_relative
