# Local development substrate.
#
# Runs under Podman (ADR-0003) and Docker Compose interchangeably. The schema is kept
# deliberately plain — no extension fields, no build contexts, no depends_on conditions
# beyond service_healthy — because `podman compose` shims an external implementation that
# occasionally lags Docker Compose on newer schema features.
#
# TIERING (ADR-0002). Services with no `profiles` key start by default; everything else is
# opt-in. The full substrate is 8-12GB, which is more than a laptop should surrender to a
# background stack, so the default `task up` brings up Tier 1 only.
#
#   task up                 Postgres + Redis          (~1.2GB)
#   task up:bus             + NATS JetStream
#   task up:observability   + Prometheus, Grafana, Loki, Tempo
#   task up:full            everything                 (~8GB)
#
# EVERY PORT IS BOUND TO 127.0.0.1 ON PURPOSE. Compose publishes on 0.0.0.0 by default,
# which would put a dev-mode Vault holding an unsealed root token, and an OpenSearch with
# security disabled, on whatever network the laptop is attached to. Do not remove the
# loopback prefixes.
#
# PORTS ARE OFFSET INTO A 5xxxx RANGE (Postgres 55432, Redis 56379, Grafana 53000, …) rather
# than using defaults. A developer machine typically already has a Postgres or Redis running
# for something else — this one did, on both 5432 and 6379 — and a substrate that fights for
# default ports fails on first run for reasons that look like a broken compose file. The
# offset is mechanical: container port unchanged, host port prefixed with 5.
#
# Credentials here are development-only values for a loopback-bound stack. Production
# secrets come from Vault and never from a compose file.

name: satta

services:

  # ------------------------------------------------------------------ Tier 1: always up

  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: satta
      POSTGRES_PASSWORD: satta
      POSTGRES_DB: satta
      # Deterministic collation. Left to the host locale, ORDER BY results differ between a
      # developer machine and CI, which makes pagination tests flap for reasons nobody
      # connects to collation for about a day.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      # Serializable-friendly settings and enough logging to diagnose a slow query locally
      # without turning on a firehose.
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - track_io_timing=on
      # Row-level security is load-bearing for tenant isolation, so make it obvious in the
      # logs when a connection has not set the tenant session variable.
      - -c
      - log_statement=none
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/00-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satta -d satta"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------- Tier 2: event backbone

  nats:
    image: nats:2.10-alpine
    profiles: [bus, full]
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    ports:
      - "127.0.0.1:54222:4222"
      - "127.0.0.1:58222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 3s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------ Tier 2: object + email

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [storage, full]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: satta
      MINIO_ROOT_PASSWORD: satta-dev-secret
    ports:
      # API on 9002 rather than the default 9000, which ClickHouse's native protocol wants.
      - "127.0.0.1:59002:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Mailpit rather than MailHog: MailHog is unmaintained and has no arm64 image.
    image: axllent/mailpit:v1.21
    profiles: [mail, full]
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --------------------------------------------------------------- Tier 2: secrets

  vault:
    image: hashicorp/vault:1.18
    profiles: [secrets, full]
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: satta-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:58200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------- Tier 2: analytics + search

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    profiles: [analytics, full]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: satta
      CLICKHOUSE_PASSWORD: satta
      CLICKHOUSE_DB: satta_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:58123:8123"
      - "127.0.0.1:59000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    profiles: [search, full]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      # The heaviest component in the stack by a wide margin. Capped hard so that opting
      # into the search profile does not evict everything else.
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # Local only. Security plugin off means no TLS and no auth, which is exactly why this
      # service is bound to loopback.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:59200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------- Tier 2: durable execution

  temporal:
    image: temporalio/auto-setup:1.26.2
    profiles: [workflow, full]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: satta
      POSTGRES_PWD: satta
      POSTGRES_SEEDS: postgres
      # Temporal owns its own databases; it must not share the platform schema.
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "127.0.0.1:57233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.32.0
    profiles: [workflow, full]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:53000
    ports:
      - "127.0.0.1:58233:8080"

  # -------------------------------------------------------------- Tier 2: observability

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability, full]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=72h
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:59090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability, full]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:53100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability, full]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:53200:3200"
      - "127.0.0.1:54317:4317"
      - "127.0.0.1:54318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability, full]
    restart: unless-stopped
    environment:
      # Anonymous admin. Acceptable only because this is loopback-bound and disposable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "127.0.0.1:53000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  clickhouse-data:
  opensearch-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
